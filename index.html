<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Window Plans — prototype</title><style>
:root{font-family:system-ui,sans-serif;color:#233746;background:#f1f4f6;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:24px 16px}h1{font-size:1.6rem;margin:0 0 20px}.viz-controls{display:grid;grid-template-columns:minmax(0,1fr);gap:14px 18px;margin-bottom:20px}.form-label{display:block;font-weight:500}.form-control{display:block;width:100%;font:inherit;margin-top:7px;padding:12px;background:#fff;border:1px solid #9faeb9;border-radius:8px;color:#233746}.form-control:focus{outline:3px solid #a8d9f7}.card{padding:20px;background:#fff;border:1px solid #b9c6cf;border-radius:12px;box-shadow:0 10px 28px #0003}.viz-row{display:flex;gap:12px}.btn{font:inherit;padding:12px 20px;border:1px solid #9faeb9;border-radius:8px;background:#fff;color:#233746;cursor:pointer}.btn-primary{background:#233746;color:#fff}.text-destructive{color:#a22929}.tabular-nums{font-variant-numeric:tabular-nums}[hidden]{display:none!important}svg{display:block}.cursor-interaction{cursor:ew-resize}g[data-adjust="1"]{cursor:ns-resize}.drag-reading{position:absolute;z-index:4;pointer-events:none;padding:10px 14px;background:#233746;color:#fff;border-radius:8px;font-weight:600;white-space:nowrap;box-shadow:0 3px 12px #0003}.note{font-size:.9rem;color:#486273;line-height:1.5}@media(max-width:480px){main{padding:18px 12px}.viz-controls{gap:12px}h1{font-size:1.4rem}}
</style></head><body><main><h1>Window Plans</h1><div id="window-touch-lock" style="position:relative">
<div class="viz-controls">
<label class="form-label">Overall width (mm)<input class="form-control" type="number" min="1" value="1800" inputmode="decimal"></label>
<label class="form-label">Overall height (mm)<input class="form-control" type="number" min="1" value="1200" inputmode="decimal"></label>
<label class="form-label">Outer frame (mm)<input class="form-control" type="number" min="0" value="70" inputmode="decimal"></label>
<label class="form-label">Number of panes<input class="form-control" type="number" min="1" max="30" step="1" value="3" inputmode="numeric"></label>
<label class="form-label">Intermediate frame (mm)<input class="form-control" type="number" min="0" value="60" inputmode="decimal"></label>
</div>
<p class="text-destructive" data-error role="alert"></p>
<div data-plot></div>
<div data-reading class="drag-reading" hidden></div>
<div data-editor class="card" hidden style="position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:180px;width:min(280px,90%)">
<label class="form-label" data-edit-label for="window-touch-lock-value">Width (mm)</label>
<input id="window-touch-lock-value" class="form-control" type="text" pattern="[0-9]*" inputmode="numeric">
<div class="viz-row" style="margin-top:12px"><button class="btn btn-primary" data-apply type="button">Apply</button><button class="btn" data-close type="button">Cancel</button></div>
</div>
<p class="tabular-nums" data-result aria-live="polite"></p>
</div>
<script>
(()=>{const root=document.getElementById('window-touch-lock'),plot=root.querySelector('[data-plot]'),inputs=[...root.querySelectorAll('.viz-controls input')],error=root.querySelector('[data-error]'),result=root.querySelector('[data-result]');
function sync(oldNode,newNode){if(oldNode.nodeType===3){oldNode.nodeValue=newNode.nodeValue;return;}for(const a of [...oldNode.attributes])if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);for(const a of [...newNode.attributes])oldNode.setAttribute(a.name,a.value);for(let i=0;i<newNode.childNodes.length;i++){const child=oldNode.childNodes[i],next=newNode.childNodes[i];if(!child){oldNode.appendChild(next.cloneNode(true));}else if(child.nodeType!==next.nodeType||child.nodeName!==next.nodeName){child.replaceWith(next.cloneNode(true));}else sync(child,next);}while(oldNode.childNodes.length>newNode.childNodes.length)oldNode.lastChild.remove();}
function draw(){const [w,h,t,n,m]=inputs.map(e=>e.valueAsNumber);const pw=(w-2*t-(n-1)*m)/n,ph=h-2*t;if(![w,h,t,n,m].every(Number.isFinite)||w<=0||h<=0||t<0||m<0||!Number.isInteger(n)||n<1||n>30||pw<=0||ph<=0){plot.innerHTML='';result.textContent='';error.textContent='Use 1–30 whole panes and positive dimensions. Frames must leave space for each pane.';return;}error.textContent='';const size=Math.max(260,plot.clientWidth),height=350,s=Math.min((size-100)/w,(height-90)/h),W=w*s,H=h*s,T=t*s,x=(size-W)/2-10,y=(height-H)/2+15;let panes='';for(let i=0;i<n;i++){panes+=`<rect x="${x+T+i*(pw+m)*s}" y="${y+T}" width="${pw*s}" height="${ph*s}" fill="url(#window-touch-lock-glass)" stroke="#a9b2b8"/>`;}
const markup=`<svg width="100%" height="${height}" viewBox="0 0 ${size} ${height}" role="img" aria-label="${n} equal panes side by side in a ${w} by ${h} mm window, outer frame ${t} mm and intermediate frames ${m} mm"><defs><linearGradient id="window-touch-lock-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9b8c3"/><stop offset=".24" stop-color="#dce4e9"/><stop offset=".43" stop-color="#b9c6ce"/><stop offset=".51" stop-color="#f4f7f9"/><stop offset=".6" stop-color="#cbd5db"/><stop offset="1" stop-color="#8f9faa"/></linearGradient></defs><rect width="${size}" height="${height}" fill="#e8e8e8"/><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#ffffff" stroke="#b8bec3"/>${panes}<g fill="none" stroke="#65717b"><path d="M${x} ${y-8}V${y-22}M${x+W} ${y-8}V${y-22}M${x} ${y-16}H${x+W}"/><path d="M${x+W+8} ${y}H${x+W+22}M${x+W+8} ${y+H}H${x+W+22}M${x+W+16} ${y}V${y+H}"/></g><g fill="#263540"><g data-adjust="0" class="cursor-interaction" style="touch-action:none"><rect x="${x+W/2-60}" y="${y-53}" width="120" height="44" fill="#e8e8e8"/><text x="${x+W/2}" y="${y-27}" text-anchor="middle">↔ ${w} mm</text></g><g data-adjust="1" class="cursor-interaction" style="touch-action:none"><rect x="${x+W+18}" y="${y+H/2-65}" width="40" height="130" fill="#e8e8e8"/><text transform="translate(${x+W+38},${y+H/2}) rotate(90)" text-anchor="middle">↔ ${h} mm</text></g></g></svg>`;if(drag&&plot.firstElementChild){const template=document.createElement('template');template.innerHTML=markup;sync(plot.firstElementChild,template.content.firstElementChild);}else{plot.innerHTML=markup;}result.textContent=`Each pane opening: ${+pw.toFixed(1)} × ${+ph.toFixed(1)} mm`;}
const editor=root.querySelector('[data-editor]'),editValue=root.querySelector('#window-touch-lock-value');let editing=0,drag=null;const reading=root.querySelector('[data-reading]');
function showReading(cx,cy,delta){if(!drag)return;reading.hidden=false;reading.textContent=inputs[drag.index].value+' mm';const bounds=root.getBoundingClientRect(),rw=reading.offsetWidth,rh=reading.offsetHeight;let left=cx-bounds.left-rw/2,top=cy-bounds.top-rh-65;if(drag.index===0){left=cx-bounds.left+(delta>=0?-rw-55:55);}else{left=cx-bounds.left-rw-45;top=cy-bounds.top+(delta>=0?60:-rh-60);}reading.style.left=Math.max(4,Math.min(root.clientWidth-rw-4,left))+'px';reading.style.top=Math.max(plot.offsetTop,top)+'px';}

function openEditor(index){reading.hidden=true;editing=index;editor.style.top=(plot.offsetTop+75)+'px';root.querySelector('[data-edit-label]').textContent=(index===0?'Width':'Height')+' (mm)';editValue.setCustomValidity('');editValue.value=inputs[index].value;editor.hidden=false;editValue.focus({preventScroll:true});editValue.select();}
function apply(){const v=editValue.value.trim()===''?NaN:Number(editValue.value);if(!Number.isFinite(v)||v<=0){editValue.setCustomValidity('Enter a positive measurement.');editValue.reportValidity();return;}editValue.setCustomValidity('');inputs[editing].value=v;editor.hidden=true;draw();}
editValue.addEventListener('input',()=>editValue.setCustomValidity(''));root.querySelector('[data-apply]').addEventListener('click',apply);root.querySelector('[data-close]').addEventListener('click',()=>editor.hidden=true);editValue.addEventListener('keydown',e=>{if(e.key==='Enter')apply();if(e.key==='Escape')editor.hidden=true;});
plot.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const target=e.target.closest('[data-adjust]');if(!target)return;e.preventDefault();const index=Number(target.dataset.adjust);drag={index,startX:e.clientX,startY:e.clientY,value:inputs[index].valueAsNumber,moved:false};plot.setPointerCapture(e.pointerId);});
plot.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!drag)return;e.preventDefault();const delta=drag.index===0?e.clientX-drag.startX:drag.startY-e.clientY;if(Math.abs(delta)>4)drag.moved=true;if(drag.moved){const t=inputs[2].valueAsNumber,n=inputs[3].valueAsNumber,m=inputs[4].valueAsNumber;const min=drag.index===0?2*t+(n-1)*m+n:2*t+1;inputs[drag.index].value=Math.max(Math.ceil(min/10)*10,Math.round((drag.value+delta*5)/10)*10);draw();showReading(e.clientX,e.clientY,delta);}});
let touchDrag=false;
plot.addEventListener('touchstart',e=>{const target=e.target.closest('[data-adjust]');if(!target||e.touches.length!==1)return;e.preventDefault();const point=e.touches[0],index=Number(target.dataset.adjust);touchDrag=true;drag={index,startX:point.clientX,startY:point.clientY,value:inputs[index].valueAsNumber,moved:false};},{passive:false});
document.addEventListener('touchmove',e=>{if(!touchDrag||!drag)return;e.preventDefault();const point=e.touches[0];if(!point)return;const delta=drag.index===0?point.clientX-drag.startX:drag.startY-point.clientY;if(Math.abs(delta)>4)drag.moved=true;if(drag.moved){const t=inputs[2].valueAsNumber,n=inputs[3].valueAsNumber,m=inputs[4].valueAsNumber,min=drag.index===0?2*t+(n-1)*m+n:2*t+1;inputs[drag.index].value=Math.max(Math.ceil(min/10)*10,Math.round((drag.value+delta*5)/10)*10);draw();showReading(point.clientX,point.clientY,delta);}},{passive:false,capture:true});
document.addEventListener('touchend',e=>{if(!touchDrag)return;e.preventDefault();touchDrag=false;if(drag){const index=drag.index;drag=null;openEditor(index);}},{passive:false,capture:true});
document.addEventListener('touchcancel',()=>{if(touchDrag){touchDrag=false;drag=null;reading.hidden=true;}},{capture:true});
plot.addEventListener('pointerup',e=>{if(e.pointerType==='touch'||!drag)return;const index=drag.index;drag=null;openEditor(index);});plot.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch'){drag=null;reading.hidden=true;}});
inputs.forEach(e=>e.addEventListener('input',draw));new ResizeObserver(draw).observe(plot);draw();})();
</script>
<p class="note">Dimensions in mm, including frames. Drag a measurement to adjust in 10 mm steps; tap or release to enter an exact value. Panes have equal widths.</p></main></body></html>
